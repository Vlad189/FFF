<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Цитрін: Косметична Лавка</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #3f3f46; /* zinc-700 */
        font-family: 'Press Start 2P', cursive;
        image-rendering: pixelated;
      }
      .pixelated {
        image-rendering: pixelated;
      }
      /* Custom scrollbar for pixel aesthetic */
      ::-webkit-scrollbar {
        width: 12px;
        background: #52525b; /* zinc-600 */
      }
      ::-webkit-scrollbar-thumb {
        background: #fde047; /* yellow-300 */
        border: 2px solid #52525b; /* zinc-600 */
      }

      /* Styles for Org Chart Visualization */
      .org-chart-container ul {
        position: relative;
        padding-left: 20px;
      }
      .org-chart-container li {
        position: relative;
      }
      /* Vertical connector line from parent */
      .org-chart-node-children::before {
        content: '';
        position: absolute;
        top: -10px;
        left: -10px;
        width: 2px;
        height: calc(100% - 12px);
        background-color: #4b5563; /* gray-600 */
      }
      /* Horizontal connector line for each child */
       .org-chart-node-wrapper::before {
        content: '';
        position: absolute;
        top: 24px;
        left: -10px;
        width: 10px;
        height: 2px;
        background-color: #4b5563; /* gray-600 */
      }

    </style>
